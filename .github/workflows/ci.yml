# Lints and tests the agent, replays every recorded scenario set with the scripted model (no GPU
# here: the real model's scores come from `payflow-agent eval` on the machine that has one, see
# docs/EVALS.md), then builds the image and validates the Kubernetes manifests that deploy it.
# Nothing is pushed or deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt

      # the versions the tests ran with locally (constraints.txt), so CI tests the same code
      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Includes: every runbook parses, every derived recording is what evals/derive.py makes, every
      # scenario set replays end to end with the scripted model, and the planted text is where the
      # scenario says.
      - name: Test
        run: pytest -q

  deploy-artifacts:
    name: image and manifests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t payflow-incident-agent:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm payflow-incident-agent:ci payflow-agent --help
          docker run --rm payflow-incident-agent:ci python -c "import mcp_server.server, api.app; from agent import config, runbooks; [runbooks.load(p.stem, config.RUNBOOKS_DIR) for p in config.RUNBOOKS_DIR.glob('*.md')]"

      - name: Validate manifests against the Kubernetes API schemas
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 < rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 < deploy/k8s-host/agent-on-host.yaml

      - name: Check the scripts
        run: shellcheck -S warning scripts/k8s-deploy.sh evals/faults/*.sh
