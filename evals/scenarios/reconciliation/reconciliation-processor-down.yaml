name: reconciliation-processor-down
alert: ReconciliationRunFailed
recording: ReconciliationRunFailed-processor-down.json
description: >
  The processor was scaled to zero; 2026-10-21 was reconciled by hand and failed.
caused_by: >
  Recorded live on 2026-10-23 with evals/faults/reconciliation-source-down.sh. The hour's evidence also shows the earlier rounds of that morning (the alert looks back an hour): the source down now is the cause.
