name: processor-not-running
alert: ProcessorCircuitOpen
recording: ProcessorCircuitOpen-processor-not-running.json
description: >
  The card processor's deployment was scaled to zero replicas while about 5 payments a second
  were being made. There was no pod to answer payment-service's calls.
caused_by: >
  evals/faults/traffic.sh, then evals/faults/processor-not-running.sh start
  (kubectl -n payflow scale deployment processor-simulator --replicas=0).
  Recorded on 2026-10-15, as the alert began to fire (about 90 seconds after the scale-down).
cleaned_up_by: kubectl -n payflow scale deployment processor-simulator --replicas=2
expected:
  root_causes: [processor_not_running]
  # The pod status says it is scaled to zero, and its health shows no instance at all.
  key_checks: [processor_pods, processor_health]
