name: outage-just-ended
alert: ProcessorCircuitOpen
recording: ProcessorCircuitOpen-outage-just-ended.json
description: >
  The card processor was switched to a simulated outage for 150 seconds while about 5 payments
  a second were being made, and the investigation began just after the outage ended: the
  circuit breaker had closed again and payments were going through, but the alert was still
  listed. The cause has to be found in what happened, not in what is happening.
caused_by: >
  evals/faults/traffic.sh 6, then evals/faults/processor-outage.sh start 150,
  evals/faults/wait-for-alert.sh ProcessorCircuitOpen, evals/faults/processor-outage.sh wait-ended,
  and the investigation at once. Recorded on 2026-10-14, a few seconds after the breaker closed.
  The processor's pods show start-up probe warnings from 20 minutes before, when an earlier
  scenario was cleaned up: true, and beside the point.
cleaned_up_by: Nothing to undo; the outage had ended.
expected:
  root_causes: [processor_outage]
  # As in processor-outage: the processor's own log says an outage was switched on, and its
  # health still shows the 5xx answers of the last minutes.
  key_checks: [processor_errors, processor_health]
