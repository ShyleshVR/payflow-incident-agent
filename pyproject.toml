[project]
name = "payflow-incident-agent"
version = "0.1.0"
description = "An on-call agent for PayFlow: investigates alerts with a self-hosted model, proposes a fix, acts after approval."
requires-python = ">=3.12"
dependencies = [
    # model plumbing (the model itself is llama.cpp's llama-server, OpenAI-compatible)
    "langchain-core",
    "langchain-openai",
    # the investigation workflow
    "langgraph>=1.2",
    # a paused investigation's saved state, so that a decision can resume it after a restart
    "langgraph-checkpoint-sqlite>=3",
    # runbook headers
    "pyyaml",
    "pydantic>=2",
    "httpx",
    # the MCP server (v2 API: MCPServer, formerly FastMCP)
    "mcp>=2",
    # get_pod_status reads pods and events
    "kubernetes",
    # the agent as a service: Alertmanager's webhook and the investigations (payflow-agent serve)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
payflow-agent = "cli.payflow_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "mcp_server", "mcp_server.clients", "mcp_server.tools", "api", "cli", "evals"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
